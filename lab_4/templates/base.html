<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Компилятор{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('index') }}" class="nav-brand">
                <span class="brand-icon">⚙️</span>
                <span class="brand-text">Компилятор</span>
            </a>
            <ul class="nav-menu">
                <li><a href="{{ url_for('index') }}" class="nav-link">Главная</a></li>
                <li><a href="{{ url_for('compile_page') }}" class="nav-link">Компиляция</a></li>
                <li><a href="{{ url_for('interactive_page') }}" class="nav-link">Интерактивный режим</a></li>
                <li><a href="{{ url_for('about_page') }}" class="nav-link">О программе</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>Веб-интерфейс для компилятора</p>
            <p>© 2026 Компилятор SimpleTanchiK</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
